- name: Homelab Ubuntu baseline + Kubernetes (kubeadm + Calico)
  hosts: all
  become: true
  pre_tasks:
    - name: Ensure target is Ubuntu
      ansible.builtin.assert:
        that: ansible_distribution == "Ubuntu"
        fail_msg: "Este playbook suporta apenas Ubuntu (encontrado: {{ ansible_distribution }})"
  roles:
    - { role: base, tags: [base, update] }
    - { role: network, tags: [network] }
    - { role: hardening, tags: [hardening] }
    - { role: tailscale, tags: [tailscale] }
    - { role: motd, tags: [motd] }
    - { role: kubernetes, tags: [kubernetes], when: "'kube_control_plane' in group_names" }
    - { role: gpu, tags: [gpu], when: gpu_enabled | default(false) | bool }
