---
- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: "overlay\nbr_netfilter\n"

- name: k3s sysctl prerequisites
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop: "{{ k3s_sysctl | dict2items }}"

- name: UFW - k3s API / ingress from trusted networks
  community.general.ufw:
    rule: allow
    port: "{{ item.1 }}"
    proto: tcp
    src: "{{ item.0 }}"
    comment: "k3s {{ item.1 }}"
  loop: "{{ trusted_cidrs | product(['6443', '80', '443']) | list }}"

- name: UFW - allow pod and service networks
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    comment: k3s cluster network
  loop: ["{{ k3s_cluster_cidr }}", "{{ k3s_service_cidr }}"]

- name: k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: k3s config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    # world-readable so `kubectl` (k3s multicall) runs without warnings as non-root.
    # Never put secrets (token, etc.) in this file - use token-file instead.
    mode: "0644"
  notify: Restart k3s

# curl instead of get_url: ansible-core 2.12 get_url breaks on the target's Python 3.12 (cert_file)
- name: Download k3s installer
  ansible.builtin.command: curl -sfL https://get.k3s.io -o /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s-install.sh

- name: Make k3s installer executable
  ansible.builtin.file:
    path: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_EXEC: server

- name: Ensure k3s is running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Flush handlers (apply config changes before checks)
  ansible.builtin.meta: flush_handlers

- name: Wait for node Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  retries: 5
  delay: 10
  register: k3s_ready
  until: k3s_ready.rc == 0

- name: ~/.kube for admin user
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.kube"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: kubeconfig for admin user on the host
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ admin_user }}/.kube/config"
    remote_src: true
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"

- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: _k3s_kubeconfig

- name: Save kubeconfig locally (server -> host IP, context -> hostname)
  ansible.builtin.copy:
    dest: "{{ k3s_local_kubeconfig }}"
    mode: "0600"
    content: >-
      {{ _k3s_kubeconfig.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443')
         | replace(': default', ': ' ~ inventory_hostname) }}
  delegate_to: localhost
  become: false

- name: kubectl env for admin user (KUBECONFIG, completion, alias k)
  ansible.builtin.blockinfile:
    path: "/home/{{ admin_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED - kubectl"
    block: |
      export KUBECONFIG=$HOME/.kube/config
      source <(kubectl completion bash)
      alias k=kubectl
      complete -o default -F __start_kubectl k
  become: false
