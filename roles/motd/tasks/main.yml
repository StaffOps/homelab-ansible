---
- name: Install figlet (banner)
  ansible.builtin.apt:
    name: figlet
    state: present

- name: Disable Ubuntu motd-news fetcher
  ansible.builtin.lineinfile:
    path: /etc/default/motd-news
    regexp: '^ENABLED='
    line: ENABLED=0
    create: true
    mode: "0644"

- name: Silence default noisy motd scripts
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"   # non-executable = skipped by run-parts
  loop: [00-header, 10-help-text, 50-motd-news, 50-landscape-sysinfo, 88-esm-announce, 91-contract-ua-esm-status]
  failed_when: false

- name: Install custom motd
  ansible.builtin.template:
    src: 01-homelab.sh.j2
    dest: /etc/update-motd.d/01-homelab
    mode: "0755"

- name: Empty static /etc/motd
  ansible.builtin.copy:
    dest: /etc/motd
    content: ""
    mode: "0644"
