---
- name: Stop cloud-init from regenerating the network config
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    mode: "0644"
    content: "network: {config: disabled}\n"

# Calico docs: NetworkManager must not manage Calico interfaces
- name: NetworkManager - ignore Calico / CNI interfaces
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/calico.conf
    mode: "0644"
    content: |
      [keyfile]
      unmanaged-devices=interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
  notify: Reload NetworkManager

- name: Static IP netplan config
  ansible.builtin.template:
    src: 60-static.yaml.j2
    dest: /etc/netplan/60-static.yaml
    mode: "0600"
  register: _netplan

- name: Validate netplan
  ansible.builtin.command: netplan generate
  changed_when: false
  when: _netplan is changed

# Same IP as before -> the SSH session survives or reconnects quickly
- name: Apply netplan (async, connection may blip)
  ansible.builtin.command: netplan apply
  async: 60
  poll: 0
  when: _netplan is changed and not ansible_check_mode

- name: Wait for the host to come back
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 120
  when: _netplan is changed and not ansible_check_mode

- name: Assert static address is active
  ansible.builtin.command: ip -4 -o addr show {{ net_interface }}
  register: _ip
  changed_when: false
  failed_when: >-
    net_address not in _ip.stdout or 'dynamic' in _ip.stdout
  when: not ansible_check_mode
