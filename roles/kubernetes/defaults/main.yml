---
kube_version_minor: "1.37"           # apt channel on pkgs.k8s.io (latest = v1.37.x)
kube_pod_cidr: 10.244.0.0/16         # Calico IPPool CIDR
kube_service_cidr: 10.96.0.0/12      # kubeadm default
kube_cert_extra_sans: []            # e.g. DNS names for the API server
kube_cert_sans: "{{ [ansible_host, ansible_hostname] + kube_cert_extra_sans }}"
# Single node: remove the control-plane NoSchedule taint so workloads can run here at all.
kube_untaint_control_plane: true
kube_local_kubeconfig: "{{ playbook_dir }}/kubeconfig"
# Backup of the Secrets encryption key, OUTSIDE the repo (losing it = losing every Secret)
kube_encryption_backup: "~/.config/homelab/{{ inventory_hostname }}-encryption-config.yaml"
kube_audit_log_maxage: 7             # days
kube_audit_log_maxbackup: 5          # files
kube_audit_log_maxsize: 100          # MB per file
kube_sysctl:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 524288

helm_version: v4.3.2
# Calico via the Tigera operator Helm chart (Calico 3.33 is tested with Kubernetes 1.35-1.37)
calico_version: v3.33.0             # v3.33.1 is in the chart index but its .tgz is 404 on GitHub
calico_map_api_version: v1            # MutatingAdmissionPolicy API: v1 for K8s >= 1.36, v1beta1 for 1.34/1.35
calico_encapsulation: VXLAN          # single node: no inter-node traffic; VXLAN avoids BGP
