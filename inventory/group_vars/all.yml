---
# ---- base ----
timezone: America/Fortaleza
base_packages:
  - curl
  - wget
  - vim
  - htop
  - git
  - jq
  - unzip
  - ca-certificates
  - gnupg
  - net-tools
  - dnsutils
  - chrony
# Reboot automatically when /var/run/reboot-required exists after upgrades
base_reboot_if_required: true

# ---- hardening ----
admin_user: karlipegomes
# Public key installed in admin_user's authorized_keys (your default key)
admin_pubkey_file: ~/.ssh/id_rsa.pub
ssh_port: 22
ssh_allow_users: ["{{ admin_user }}"]
# Networks allowed to reach SSH / k3s API / ingress. Adjust to your LAN.
trusted_cidrs:
  - 192.168.68.0/24
fail2ban_bantime: 1h
fail2ban_maxretry: 5

# ---- motd ----
motd_title: "HOMELAB"
motd_environment: "homelab"

# ---- kubernetes ----
# Role defaults: roles/kubernetes/defaults/main.yml (versions, CIDRs, Calico options)
# Extra API server certificate SANs (Cloudflare A record -> 192.168.68.104, DNS only)
kube_cert_extra_sans: ["k8s01.staffops.space"]
kube_api_client_host: k8s01.staffops.space   # local kubeconfig uses the DNS name
